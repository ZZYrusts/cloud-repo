<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云仓库 · git.zzy.skin</title><style>body{margin:0;font:16px system-ui;background:#0b1220;color:#e8eefc}main{max-width:960px;margin:8vh auto;padding:24px}.card{background:#121c31;border:1px solid #263657;border-radius:18px;padding:28px;box-shadow:0 12px 40px #0004}h1{margin:0 0 8px}p{color:#aebbd5}.drop{margin-top:24px;border:1px dashed #5373ad;border-radius:14px;padding:38px;text-align:center}.btn{display:inline-block;margin-top:16px;padding:11px 18px;border-radius:10px;background:#6ea8fe;color:#09101f;border:0;font-weight:700;cursor:pointer}table{width:100%;margin-top:24px;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #263657;text-align:left}</style></head><body><main><div class="card"><h1>云仓库</h1><p>安全、简洁的个人文件仓库 · git.zzy.skin</p><div class="drop"><strong>拖拽文件到这里</strong><br><span>或选择本地文件上传</span><br><input id="file" type="file" multiple hidden><button class="btn" onclick="file.click()">选择文件</button></div><table><thead><tr><th>文件名</th><th>大小</th><th>操作</th></tr></thead><tbody id="list"><tr><td colspan="3">暂无文件</td></tr></tbody></table></div></main><script>const file=document.querySelector('#file'),list=document.querySelector('#list');file.onchange=()=>{list.innerHTML=[...file.files].map(f=>`<tr><td>${f.name}</td><td>${(f.size/1024).toFixed(1)} KB</td><td>待连接 R2</td></tr>`).join('')||'<tr><td colspan="3">暂无文件</td></tr>'}</script></body></html>
