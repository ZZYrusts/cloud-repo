:root{--bg:#090b14;--card:#111827;--card2:#0d1422;--line:#29344a;--text:#eef2ff;--muted:#94a3b8;--a:#8b5cf6;--wood:#d7a85c;--wood2:#bd8840;--black:#111827;--white:#f8fafc}*{box-sizing:border-box}body{margin:0;color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -5%,#27234b,#090b14 43%)}main{width:min(1000px,100%);margin:auto;padding:20px 14px 38px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.top h1{margin:0;font-size:clamp(29px,7vw,43px)}.top p{margin:3px 0 0;color:var(--muted)}.tag{border:1px solid #433d69;background:#19152f;color:#c4b5fd;border-radius:999px;padding:7px 11px;font-size:12px}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(270px,.75fr);gap:15px}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#121a2b,#0e1524);padding:14px;box-shadow:0 18px 60px #0003}.boardbox{position:relative;width:min(100%,700px);margin:auto;aspect-ratio:1}.boardbox canvas{display:block;width:100%;height:100%;border-radius:15px;touch-action:none;cursor:pointer}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:15px;background:#05080dcc;text-align:center;padding:20px}.hide{display:none}.overlay h2{font-size:26px;margin:0 0 5px}.overlay p{color:#cbd5e1;margin:0 0 14px}.btn{border:1px solid #475569;background:#172033;color:#fff;border-radius:11px;padding:10px 16px;min-height:44px;font-weight:750;cursor:pointer}.primary{background:#7c3aed;border-color:#8b5cf6}.bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:18px}.tools{display:flex;gap:8px;margin-top:11px}.tools .btn{flex:1}.side h2{margin:2px 0 10px;font-size:18px}.mode{border:1px solid #334155;border-radius:13px;padding:11px;margin-bottom:10px;background:#0c1320}.mode strong{display:block}.mode span{color:var(--muted);font-size:12px}.tip{color:#aab5c7;font-size:12px;line-height:1.7}.features{margin:14px 0 0;padding:0;list-style:none}.features li{padding:9px 0;border-bottom:1px solid #202a3d}.features li:last-child{border:0}.dot{color:#a78bfa}.foot{color:#64748b;font-size:11px;margin-top:12px}.thinking{color:#c4b5fd}@media(max-width:780px){main{padding:14px 10px 28px}.grid{grid-template-columns:1fr}.side{order:2}.tag{display:none}.card{border-radius:17px;padding:11px}.tools{margin-bottom:2px}} .side{display:flex;flex-direction:column;gap:12px}.side-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 4px}.side-head strong{font-size:20px}.level{font-size:12px;padding:5px 9px;border-radius:999px;background:#211a3d;color:#c4b5fd;border:1px solid #43386b}.players{display:grid;gap:8px}.player{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid #263249;border-radius:14px;background:#0b1220;transition:.2s}.player.active{border-color:#7254c7;background:#15132a;box-shadow:0 0 0 1px #7254c733 inset}.stone{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:inset 2px 2px 4px #fff2,2px 3px 8px #0006}.stone.black{background:radial-gradient(circle at 35% 28%,#475569 0,#111827 42%,#020617 100%)}.stone.white{background:radial-gradient(circle at 35% 28%,#fff 0,#f8fafc 50%,#cbd5e1 100%)}.player-main{min-width:0;flex:1}.player-main b{display:block;font-size:15px}.player-main span{display:block;color:#8290a8;font-size:12px;margin-top:1px}.turn-dot{width:7px;height:7px;border-radius:50%;background:#8b5cf6;box-shadow:0 0 0 4px #8b5cf622}.record{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.record div{padding:10px 6px;text-align:center;border:1px solid #263249;border-radius:12px;background:#0b1220}.record strong{display:block;font-size:18px}.record span{display:block;color:#718096;font-size:11px;margin-top:1px}.match{display:grid;grid-template-columns:1fr 1fr;gap:7px}.match div{padding:11px 12px;border-radius:12px;background:#0b1220;border:1px solid #263249}.match span{display:block;color:#718096;font-size:11px}.match strong{display:block;margin-top:2px;font-size:14px}.hint{margin-top:1px;text-align:center;color:#718096;font-size:12px}.version{color:#566176;font-size:10px;text-align:right;margin-top:auto}@media(max-width:780px){.side{gap:10px}.side-head{margin-top:0}.players{grid-template-columns:1fr 1fr}.record div{padding:8px 5px}.match div{padding:9px 10px}}</style></head><body><main><header class="top"><div><h1>⚫ ZZY Gomoku</h1><p>五子棋 · 极难</p></div><div class="tag">AI · HARD</div></header><div class="grid"><section class="card"><div class="bar"><div class="stat"><small>你</small><strong id="you">白棋</strong></div><div class="stat"><small>AI</small><strong>黑棋</strong></div><div class="stat"><small>状态</small><strong id="status">AI 思考中</strong></div></div><div class="boardbox"><canvas id="board" width="750" height="750"></canvas><div class="overlay" id="ov"><div><h2 id="title">AI 五子棋</h2><p id="msg">AI 先手，采用攻防搜索与杀棋检测。</p><button class="btn primary" id="go">开始对局</button></div></div></div><div class="tools"><button class="btn primary" id="new">新开一局</button><button class="btn" id="undo">悔棋</button></div></section><aside class="card side"><div class="side-head"><strong>对局</strong><span class="level">极难</span></div><div class="players"><div class="player active" id="aiPlayer"><span class="stone black"></span><div class="player-main"><b>电脑</b><span>黑棋 · 先手</span></div><span class="turn-dot"></span></div><div class="player" id="youPlayer"><span class="stone white"></span><div class="player-main"><b>你</b><span>白棋 · 后手</span></div></div></div><div class="record"><div><strong id="rw">0</strong><span>胜</span></div><div><strong id="rl">0</strong><span>负</span></div><div><strong id="rd">0</strong><span>和</span></div></div><div class="match"><div><span>当前回合</span><strong id="turnName">电脑</strong></div><div><span>手数</span><strong id="moves">0</strong></div></div><div class="hint">落子后电脑会立即应手</div><div class="version">ZZY Gomoku · v2.2.0</div></aside></div></main><script>
const N=15,S=50,C=document.getElementById("board"),ctx=C.getContext("2d"),ov=document.getElementById("ov"),status=document.getElementById("status"),title=document.getElementById("title"),msg=document.getElementById("msg");let B=[],turn=2,playing=false,thinking=false,history=[],timer=0,last=null,record=JSON.parse(localStorage.getItem("zzy-gomoku-record")||'{"w":0,"l":0,"d":0}');
const dirs=[[1,0],[0,1],[1,1],[1,-1]],W=[0,1,10,100,1000,1000000],INF=1e15;
function syncUI(){document.getElementById("rw").textContent=record.w;document.getElementById("rl").textContent=record.l;document.getElementById("rd").textContent=record.d;document.getElementById("moves").textContent=history.length;document.getElementById("turnName").textContent=turn===2?"电脑":"你";document.getElementById("aiPlayer").classList.toggle("active",turn===2&&playing);document.getElementById("youPlayer").classList.toggle("active",turn===1&&playing)}function saveRecord(){localStorage.setItem("zzy-gomoku-record",JSON.stringify(record));syncUI()}function init(){B=Array.from({length:N},()=>Array(N).fill(0));history=[];last=null;turn=2;playing=true;thinking=true;status.textContent="思考中";syncUI();draw();setTimeout(aiMove,180)}
function draw(){ctx.clearRect(0,0,C.width,C.height);ctx.fillStyle="#d7a85c";ctx.fillRect(0,0,C.width,C.height);ctx.strokeStyle="#68481f";ctx.lineWidth=2;for(let i=0;i<N;i++){let p=S/2+i*S;ctx.beginPath();ctx.moveTo(p,S/2);ctx.lineTo(p,C.height-S/2);ctx.stroke();ctx.beginPath();ctx.moveTo(S/2,p);ctx.lineTo(C.width-S/2,p);ctx.stroke()}[3,7,11].forEach(y=>[3,7,11].forEach(x=>{ctx.fillStyle="#3d2916";ctx.beginPath();ctx.arc(S/2+x*S,S/2+y*S,5,0,7);ctx.fill()}));for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(B[y][x])piece(x,y,B[y][x]);}
function piece(x,y,p){ctx.beginPath();ctx.arc(S/2+x*S,S/2+y*S,20,0,7);ctx.fillStyle=p===2?"#111827":"#f8fafc";ctx.shadowColor="#0007";ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=p===2?"#000":"#cbd5e1";ctx.lineWidth=1;ctx.stroke();if(last&&last[0]===x&&last[1]===y){ctx.beginPath();ctx.arc(S/2+x*S,S/2+y*S,4,0,7);ctx.fillStyle=p===2?"#a78bfa":"#7c3aed";ctx.fill()}}
function place(x,y,p){if(B[y][x])return false;B[y][x]=p;history.push([x,y,p]);last=[x,y];syncUI();draw();return true}
function count(x,y,p,dx,dy){let n=0,a=x+dx,b=y+dy;while(a>=0&&a<N&&b>=0&&b<N&&B[b][a]===p){n++;a+=dx;b+=dy}return n}
function win(x,y,p){return dirs.some(([dx,dy])=>1+count(x,y,p,dx,dy)+count(x,y,p,-dx,-dy)>=5)}
function openLine(x,y,p,dx,dy){let a=x+dx,b=y+dy,n=0;while(a>=0&&a<N&&b>=0&&b<N&&B[b][a]===p){n++;a+=dx;b+=dy}return {n,open:a>=0&&a<N&&b>=0&&b<N&&B[b][a]===0}}
function threat(x,y,p){B[y][x]=p;let v=0;for(const [dx,dy] of dirs){const a=openLine(x,y,p,dx,dy),b=openLine(x,y,p,-dx,-dy),n=1+a.n+b.n;if(n>=5)v+=1e9;else if(n===4&&a.open&&b.open)v+=2e6;else if(n===4&&(a.open||b.open))v+=3e5;else if(n===3&&a.open&&b.open)v+=2e4;else if(n===2&&a.open&&b.open)v+=500}B[y][x]=0;return v}
function candidates(){let set=new Set(),has=false;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(B[y][x]){has=true;for(let yy=Math.max(0,y-2);yy<=Math.min(N-1,y+2);yy++)for(let xx=Math.max(0,x-2);xx<=Math.min(N-1,x+2);xx++)if(!B[yy][xx])set.add(xx+","+yy)}if(!has)return [[7,7]];return [...set].map(s=>s.split(",").map(Number))}
function scoreMove(x,y,p){let val=threat(x,y,p);if(val>=1e9)return val;B[y][x]=p;let center=30-(Math.abs(x-7)+Math.abs(y-7));let enemy=threat(x,y,p===2?1:2);B[y][x]=0;return val+center+enemy*.55}
function ordered(p){return candidates().map(([x,y])=>[x,y,scoreMove(x,y,p)+scoreMove(x,y,p===2?1:2)*.75]).sort((a,b)=>b[2]-a[2]).slice(0,16)}
function evaluate(){let total=0;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(B[y][x]){let p=B[y][x];for(const [dx,dy] of dirs)if(x-dx<0||x-dx>=N||y-dy<0||y-dy>=N||B[y-dy][x-dx]!==p){let q=openLine(x,y,p,dx,dy),back=openLine(x,y,p,-dx,-dy),n=1+q.n+back.n,open=(q.open?1:0)+(back.open?1:0);let v=n>=5?1e8:n===4?(open===2?2e6:2e5):n===3?(open===2?2e4:500):n===2?(open===2?300:30):5;total+=(p===2?v:-v)}}return total}
function negamax(depth,alpha,beta,p){let best=-INF;if(depth===0)return evaluate()*(p===2?1:-1);let moves=ordered(p);for(const [x,y] of moves){B[y][x]=p;let v=win(x,y,p)?INF-100000-depth:-negamax(depth-1,-beta,-alpha,p===2?1:2);B[y][x]=0;if(v>best)best=v;if(v>alpha)alpha=v;if(alpha>=beta)break}return best}
function findImmediate(p){for(const [x,y] of candidates()){B[y][x]=p;if(win(x,y,p)){B[y][x]=0;return[x,y]}B[y][x]=0}return null}
function aiPick(){let w=findImmediate(2);if(w)return w;let block=findImmediate(1);if(block)return block;let moves=ordered(2);let best=moves[0],bs=-INF;for(const [x,y] of moves.slice(0,10)){B[y][x]=2;let v=win(x,y,2)?INF:-negamax(2,-INF,INF,1);B[y][x]=0;if(v>bs){bs=v;best=[x,y]}}return best.slice(0,2)}
function aiMove(){if(!playing)return;const m=aiPick();place(m[0],m[1],2);if(win(m[0],m[1],2))return end("AI 获胜","这局它没有给你留下机会 😈");turn=1;thinking=false;status.textContent="轮到你";}
function human(x,y){if(!playing||thinking||turn!==1||B[y][x])return;place(x,y,1);if(win(x,y,1))return end("你赢了！","漂亮，这局把 AI 击穿了。");turn=2;thinking=true;status.textContent="AI 思考中";setTimeout(aiMove,90)}
function end(t,m){playing=false;thinking=false;status.textContent="结束";if(t==="你赢了！")record.w++;else if(t==="AI 获胜")record.l++;else record.d++;saveRecord();title.textContent=t;msg.textContent=m;ov.classList.remove("hide");document.getElementById("go").textContent="再来一局"}
C.addEventListener("pointerdown",e=>{const r=C.getBoundingClientRect(),x=Math.round(((e.clientX-r.left)/r.width*(C.width)-S/2)/S),y=Math.round(((e.clientY-r.top)/r.height*(C.height)-S/2)/S);if(x>=0&&x<N&&y>=0&&y<N)human(x,y)});
document.getElementById("go").onclick=()=>{ov.classList.add("hide");init()};document.getElementById("new").onclick=()=>{ov.classList.add("hide");init()};document.getElementById("undo").onclick=()=>{if(!playing||thinking||history.length<2)return;history.pop();history.pop();B=Array.from({length:N},()=>Array(N).fill(0));for(const [x,y,p] of history)B[y][x]=p;last=history.length?history[history.length-1].slice(0,2):null;turn=1;syncUI();draw();status.textContent="轮到你"};draw();
</script><script>const BUILD_VERSION="2.1.0";if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}</script></body></html>
