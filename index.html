<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b14"><title>ZZY Snake · 全服排行榜</title><style>:root{--bg:#080b14;--panel:#111827;--panel2:#0d1422;--text:#eef2ff;--muted:#94a3b8;--line:#263248;--a:#a78bfa;--g:#34d399;--r:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#20204a,#080b14 42%);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1080px,100%);margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.brand h1{margin:0;font-size:clamp(28px,6vw,42px)}.brand p{margin:4px 0;color:var(--muted)}.badge{padding:7px 11px;border:1px solid #39445d;border-radius:999px;color:#c4b5fd;background:#16152c;font-size:12px}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:16px}.card{background:linear-gradient(180deg,#121a2b,#0e1524);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 16px 50px #0003}.game{display:flex;flex-direction:column;align-items:center}.stats{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:19px}.canvas{width:min(100%,620px);aspect-ratio:1;background:#070b13;border:1px solid #2c3850;border-radius:16px;padding:8px;position:relative}.canvas canvas{display:block;width:100%;height:100%;border-radius:10px;background:#090e18}.overlay{position:absolute;inset:8px;display:flex;align-items:center;justify-content:center;background:#05080fb0;border-radius:10px;text-align:center;padding:20px}.hidden{display:none!important}.overlay h2{margin:0 0 6px;font-size:25px}.overlay p{margin:0 0 14px;color:#cbd5e1}.btn{border:1px solid #475569;background:#172033;color:var(--text);border-radius:11px;padding:10px 15px;font-weight:700;cursor:pointer;min-height:44px}.primary{background:#7c3aed;border-color:#8b5cf6}.controls{display:grid;grid-template-columns:repeat(3,52px);gap:7px;margin-top:14px}.controls button{width:52px;height:46px;border-radius:12px;border:1px solid #334155;background:#151e30;color:#fff;font-size:20px}.blank{visibility:hidden}.help{text-align:center;color:var(--muted);font-size:12px}.side h2{font-size:18px;margin:2px 0 12px}.rankhead{display:flex;justify-content:space-between;align-items:center}.rankhead span{font-size:12px;color:var(--muted)}.namebox{display:flex;gap:8px;margin-bottom:12px}.namebox input{min-width:0;flex:1;background:#0b1220;border:1px solid #334155;color:#fff;border-radius:11px;padding:10px 12px;outline:none;min-height:44px}.namebox input:focus{border-color:var(--a)}ol{list-style:none;margin:0;padding:0}.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 7px;border-bottom:1px solid #202b3e}.pos{color:#a5b4fc;font-weight:800}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{font-weight:800}.empty{padding:24px 8px;text-align:center;color:var(--muted)}.foot{margin-top:14px;color:#64748b;font-size:11px;text-align:center}@media(max-width:800px){main{padding:16px 12px 32px}.grid{grid-template-columns:1fr}.side{order:2}.badge{display:none}}</style></head><body><main><header class="top"><div class="brand"><h1>🐍 ZZY Snake</h1><p>在线贪吃蛇 · 全服排行榜</p></div><div class="badge">GLOBAL LEADERBOARD</div></header><div class="grid"><section class="card game"><div class="stats"><div class="stat"><small>本局</small><strong id="score">0</strong></div><div class="stat"><small>个人最高</small><strong id="best">0</strong></div><div class="stat"><small>速度</small><strong id="speed">1.0×</strong></div></div><div class="canvas"><canvas id="game" width="600" height="600" aria-label="贪吃蛇游戏区域"></canvas><div class="overlay" id="overlay"><div><h2 id="ot">准备好了吗？</h2><p id="ox">方向键 / WASD / 下方按钮控制</p><button class="btn primary" id="start">开始游戏</button></div></div></div><div class="controls"><button class="blank" tabindex="-1">•</button><button data-d="up" aria-label="向上">▲</button><button class="blank" tabindex="-1">•</button><button data-d="left" aria-label="向左">◀</button><button data-d="down" aria-label="向下">▼</button><button data-d="right" aria-label="向右">▶</button></div><p class="help">吃到食物 +10 分 · 撞墙/自己结束 · 手机直接点方向</p></section><aside class="card side"><div class="rankhead"><h2>🏆 全服排行榜</h2><span id="online">连接中…</span></div><div class="namebox"><input id="name" maxlength="18" placeholder="你的昵称（默认匿名玩家）" autocomplete="nickname"><button class="btn" id="refresh">刷新</button></div><ol id="rank"><li class="empty">正在加载…</li></ol><div class="foot">每个昵称保存历史最高分。休闲榜采用客户端提交分数，未接入强反作弊。</div></aside></div></main><script>
const API="https://api.git.zzy.skin",c=document.getElementById("game"),x=c.getContext("2d"),ov=document.getElementById("overlay"),se=document.getElementById("score"),be=document.getElementById("best"),sp=document.getElementById("speed"),rank=document.getElementById("rank"),online=document.getElementById("online"),nameEl=document.getElementById("name");let snake,food,dir,next,running=false,score=0,best=Number(localStorage.getItem("zzy-snake-best")||0),raf=0,last=0,tick=125,started=0;be.textContent=best;
const k=p=>p.x+","+p.y;function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;tick=125;se.textContent=0;sp.textContent="1.0×";foodAt();draw()}function foodAt(){const used=new Set(snake.map(k)),a=[];for(let y=0;y<20;y++)for(let q=0;q<20;q++)if(!used.has(q+","+y))a.push({x:q,y});food=a[Math.floor(Math.random()*a.length)]||{x:0,y:0}}
function setDir(s){if(!running)return;const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[s];if(m&&!(m.x===-dir.x&&m.y===-dir.y))next=m}
function start(){reset();running=true;started=Date.now();ov.classList.add("hidden");last=performance.now();raf=requestAnimationFrame(loop)}
function loop(t){if(!running)return;if(t-last>=tick){last=t;step()}raf=requestAnimationFrame(loop)}
function step(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=20||h.y<0||h.y>=20||snake.some((p,i)=>i&&p.x===h.x&&p.y===h.y)){over();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;se.textContent=score;tick=Math.max(65,125-score*.55);sp.textContent=(125/tick).toFixed(1)+"×";foodAt()}else snake.pop();draw()}
function over(){running=false;cancelAnimationFrame(raf);best=Math.max(best,score);localStorage.setItem("zzy-snake-best",best);be.textContent=best;ov.classList.remove("hidden");document.getElementById("ot").textContent="游戏结束";document.getElementById("ox").textContent="本局 "+score+" 分 · 最高 "+best+" 分";document.getElementById("start").textContent="再来一局";if(score)saveScore(score);load()}
function draw(){const s=30;x.clearRect(0,0,600,600);x.fillStyle="#090e18";x.fillRect(0,0,600,600);x.strokeStyle="#ffffff10";for(let i=1;i<20;i++){x.beginPath();x.moveTo(i*s,0);x.lineTo(i*s,600);x.stroke();x.beginPath();x.moveTo(0,i*s);x.lineTo(600,i*s);x.stroke()}x.fillStyle="#fb7185";x.beginPath();x.arc((food.x+.5)*s,(food.y+.5)*s,8,0,7);x.fill();snake.forEach((p,i)=>{x.fillStyle=i?"#34d399":"#a78bfa";x.beginPath();x.roundRect(p.x*s+3,p.y*s+3,24,24,7);x.fill()})}
async function saveScore(v){try{await fetch(API+"/score",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:(nameEl.value.trim()||"匿名玩家").slice(0,18),score:v,durationMs:Math.max(1,Date.now()-started)})})}catch(e){}}
async function load(){try{const r=await fetch(API+"/leaderboard?limit=30",{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();online.textContent=(d.stats?.players||0)+" 位玩家 · "+(d.stats?.games||0)+" 局";rank.innerHTML=(d.rows||[]).map((z,i)=>'<li class="row"><span class="pos">'+(i+1)+'</span><span class="name">'+esc(z.name)+'</span><span class="score">'+z.score+'</span></li>').join("")||'<li class="empty">还没有分数，来当第一名！</li>'}catch(e){online.textContent="离线模式";rank.innerHTML='<li class="empty">排行榜连接失败（请稍后刷新）。</li>'}}
function esc(s){return String(s).replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[a]))}
document.getElementById("start").onclick=start;document.getElementById("refresh").onclick=load;document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>setDir(b.dataset.d));addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))return;const m={ArrowUp:"up",w:"up",W:"up",ArrowDown:"down",s:"down",S:"down",ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right"};if(m[e.key]){e.preventDefault();setDir(m[e.key])}if(e.key===" "&&!running){e.preventDefault();start()}});reset();load();
</script></body></html>
