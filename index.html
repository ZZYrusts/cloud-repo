<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云仓库 · git.zzy.skin</title><style>body{margin:0;font:16px system-ui;background:#0b1220;color:#e8eefc}main{max-width:960px;margin:8vh auto;padding:24px}.card{background:#121c31;border:1px solid #263657;border-radius:18px;padding:28px}h1{margin:0 0 8px}p{color:#aebbd5}.drop{margin-top:24px;border:1px dashed #5373ad;border-radius:14px;padding:38px;text-align:center}.btn{margin-top:16px;padding:11px 18px;border-radius:10px;background:#6ea8fe;border:0;font-weight:700}table{width:100%;margin-top:24px;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #263657;text-align:left}</style><main><div class="card"><h1>云仓库</h1><p>GitHub 仓库存储 · git.zzy.skin</p><div class="drop"><strong>选择文件上传到 GitHub 仓库</strong><br><input id="file" type="file" multiple><br><button class="btn" id="up">上传</button></div><table><thead><tr><th>文件名</th><th>大小</th></tr></thead><tbody id="list"></tbody></table></div></main><script>const file=document.querySelector("#file"),list=document.querySelector("#list");async function load(){const a=await fetch("/api/files").then(r=>r.json());list.innerHTML=(a.files||[]).map(x=>"<tr><td>"+x.name+"</td><td>"+((x.size||0)/1024).toFixed(1)+" KB</td></tr>").join("")||"<tr><td colspan=2>暂无文件</td></tr>"}document.querySelector("#up").onclick=async()=>{for(const f of file.files){const b=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(f)});await fetch("/api/files/"+encodeURIComponent(f.name),{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({content:b})})}load()};load()</script>
